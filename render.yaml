# Render deployment for the STANDALONE Account Research app.
#
# This service is completely independent of the Skeqi-EmailDrafter CRM: its own
# models, retrieval, Apollo, credentials, reports and storage. The CRM embeds it
# in an iframe and shares nothing else with it.
#
# Single-job research runs on the WORKER service, not here. The web service
# enqueues into Neon and reads from it, so it owns no run and a deploy of it
# cannot kill one. Batch runs still use in-process threads (app.BATCHES) and are
# still lost on restart; moving them onto the queue is separate work.
services:
  - type: web
    name: skeqi-account-research
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Two workers are safe now: no request depends on process memory. The
    # timeout drops from 600s because no request is long-running any more -
    # research happens in the worker service below.
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"

      - key: DATABASE_URL      # enqueue and read; the web service runs no research
        sync: false
      # ── Access gate ──────────────────────────────────────────────────────
      # Without BOTH of these the app is open to anyone with the URL.
      - key: APP_ACCESS_USERNAME
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: APP_ACCESS_SECRET      # optional; defaults to a value derived from the password
        sync: false
      # Server-to-server secret the CRM backend presents as X-AR-Service-Key.
      # MUST equal ACCOUNT_RESEARCH_SERVICE_KEY on the CRM service.
      - key: APP_SERVICE_KEY
        sync: false

      # ── Embedding ────────────────────────────────────────────────────────
      # The CRM origin allowed to frame this app. Scheme + host, no path.
      # Never use "*".
      - key: ALLOWED_FRAME_ANCESTORS
        sync: false

      # ── DashScope / Bailian ──────────────────────────────────────────────
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_WORKSPACE_ID
        sync: false
      - key: DASHSCOPE_BASE_URL
        sync: false
      - key: DASHSCOPE_PATH_TEXT
        value: /services/aigc/text-generation/generation
      - key: DASHSCOPE_PATH_MULTIMODAL
        value: /services/aigc/multimodal-generation/generation
      - key: DASHSCOPE_MULTIMODAL_MODELS
        value: qwen3.6-flash,qwen3.7-plus,qwen3.8-max,qwen3.8-flash
      - key: AI_MODEL_QUALITY
        value: deepseek-v4-pro
      - key: AI_MODEL_FAST
        value: deepseek-v4-flash-0731
      - key: AI_MODEL_CITATION
        value: qwen3.6-flash
      - key: AI_MODEL_FALLBACKS     # optional, for 403 AccessDenied models
        sync: false
      - key: AI_SEARCH_STRATEGY
        value: turbo
      - key: AI_SEARCH_ENABLED
        value: "true"
      - key: AI_SOURCE_ENABLED
        value: "true"
      - key: AI_CITATION_ENABLED
        value: "true"
      - key: AI_CITATION_FORMAT
        value: "[<number>]"
      - key: AI_REQUEST_TIMEOUT_MS
        value: "90000"

      # ── Apollo (optional people enrichment) ──────────────────────────────
      - key: APOLLO_API_KEY
        sync: false
      - key: APOLLO_ENRICH_LIMIT
        value: "12"

      # ── Optional ────────────────────────────────────────────────────────
      - key: DASHSCOPE_REGION       # informational; routing uses DASHSCOPE_BASE_URL
        sync: false
      - key: TOKEN_PLAN_API_KEY     # not used by the native protocol; leave unset
        sync: false
      - key: TOKEN_PLAN_BASE_URL
        sync: false
      - key: AI_PRICE_INPUT_PER_1K  # cost reporting; omitted = "pricing not configured"
        sync: false
      - key: AI_PRICE_OUTPUT_PER_1K
        sync: false
      - key: AI_PRICE_CURRENCY
        sync: false

  # Research execution. Two instances, one job each; that IS the concurrency
  # model. A deploy of the web service above cannot touch a run in progress
  # here, and if an instance dies its lease lapses and the other reclaims the
  # job within 90 seconds.
  - type: worker
    name: skeqi-account-research-worker
    env: python
    plan: starter
    numInstances: 2
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # The worker does the research, so it needs the full credential set.
      - key: DATABASE_URL          # the same Neon database the CRM uses
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        sync: false
      - key: DASHSCOPE_WORKSPACE_ID
        sync: false
      - key: TAVILY_MCP_URL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: CRM_CALLBACK_URL
        sync: false
      - key: APP_SERVICE_KEY       # presented to the CRM as X-AR-Service-Key
        sync: false
      - key: MAX_CONCURRENT_RESEARCH_JOBS
        value: "2"
      - key: RESEARCH_WORKER_SLOTS
        value: "1"
      - key: RESEARCH_LEASE_SECONDS
        value: "90"
      - key: RESEARCH_HEARTBEAT_SECONDS
        value: "30"
      - key: RESEARCH_MAX_ATTEMPTS
        value: "3"
      - key: RESEARCH_CLAIM_POLL_SECONDS
        value: "5"
